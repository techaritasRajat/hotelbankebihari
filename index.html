<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Banke Bihari Heritage Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- SEO Schema Markup for Hotel and Reviews -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Hotel",
      "name": "Banke Bihari Heritage Hotel",
      "description": "Experience luxury and comfort in the heart of heritage. Our hotel offers a unique blend of traditional architecture and modern amenities.",
      "url": "https://www.bankebiharihotel.com",
      "telephone": "+918179343060",
      "email": "info@bankebiharihotel.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Heritage Street",
        "addressLocality": "City Center",
        "addressRegion": "State",
        "postalCode": "12345",
        "addressCountry": "IN"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "150",
        "bestRating": "5",
        "worstRating": "1"
      },
      "priceRange": "$$",
      "amenityFeature": [
        {
          "@type": "LocationFeatureSpecification",
          "name": "Free WiFi",
          "value": true
        },
        {
          "@type": "LocationFeatureSpecification",
          "name": "Swimming Pool",
          "value": true
        },
        {
          "@type": "LocationFeatureSpecification",
          "name": "Restaurant",
          "value": true
        }
      ]
    }
    </script>
  </head>

    <div id="root"></div>
