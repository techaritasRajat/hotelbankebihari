AWSTemplateFormatVersion: '2010-09-09'
Description: Banke Bihari Hotel - CI/CD Pipelines (Stage + Prod)

Parameters:
  CodeStarConnectionArn:
    Type: String
    Default: 'arn:aws:codeconnections:ap-south-1:176944445773:connection/5b15d804-d63a-4805-82fc-9a88b7ab27be'
    Description: GitHub CodeStar/CodeConnections ARN

  GitHubOwner:
    Type: String
    Default: 'techaritasRajat'
    Description: GitHub account/organisation name

  GitHubRepo:
    Type: String
    Default: 'hotelbankebihari'
    Description: GitHub repository name

  # These are resolved from stack exports (set after frontend + backend stacks are deployed)
  StageFrontendBucket:
    Type: String
    Default: hotel-frontend-stage
    Description: S3 bucket name for stage frontend (from frontend-stage stack output)

  ProdFrontendBucket:
    Type: String
    Default: hotel-frontend-prod
    Description: S3 bucket name for prod frontend (from frontend-prod stack output)

  StageCFDistributionId:
    Type: String
    Description: CloudFront distribution ID for stage (from frontend-stage stack output)

  ProdCFDistributionId:
    Type: String
    Description: CloudFront distribution ID for prod (from frontend-prod stack output)

  StageLambdaFunctionName:
    Type: String
    Default: hotel-api-stage
    Description: Lambda function name for stage (from backend-stage stack output)

  ProdLambdaFunctionName:
    Type: String
    Default: hotel-api-prod
    Description: Lambda function name for prod (from backend-prod stack output)

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for prod deployment approval notifications (optional)

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:

  # ────────────────────────────────────────────────────────────────────────────
  # S3 Artifact Bucket (shared between all pipelines)
  # ────────────────────────────────────────────────────────────────────────────

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub hotel-pipeline-artifacts-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: HotelBankeBihari

  # ────────────────────────────────────────────────────────────────────────────
  # SNS Topic for prod approval notification (optional)
  # ────────────────────────────────────────────────────────────────────────────

  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: hotel-prod-approval
      DisplayName: Hotel Prod Deployment Approval

  ApprovalSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref ApprovalTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ────────────────────────────────────────────────────────────────────────────
  # CodeBuild IAM Role (shared by all CodeBuild projects)
  # ────────────────────────────────────────────────────────────────────────────

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hotel-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
              # Pipeline artifact bucket
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              # Frontend S3 buckets (deploy)
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::hotel-frontend-stage
                  - !Sub arn:aws:s3:::hotel-frontend-stage/*
                  - !Sub arn:aws:s3:::hotel-frontend-prod
                  - !Sub arn:aws:s3:::hotel-frontend-prod/*
              # Lambda deploy
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:hotel-api-stage
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:hotel-api-prod
              # CloudFront invalidation
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: '*'
              # SSM read (VITE_API_BASE_URL injection at build time)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hotel/*
              # CodeConnections
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref CodeStarConnectionArn

  # ────────────────────────────────────────────────────────────────────────────
  # CodePipeline IAM Role
  # ────────────────────────────────────────────────────────────────────────────

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hotel-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: '*'
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref CodeStarConnectionArn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ApprovalTopic

  # ────────────────────────────────────────────────────────────────────────────
  # CodeBuild Projects — Stage (build + deploy in one step)
  # ────────────────────────────────────────────────────────────────────────────

  StageFrontendBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hotel-frontend-stage
      Description: Build and deploy frontend to stage (S3 + CloudFront)
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENV
            Value: stage
          - Name: FRONTEND_BUCKET
            Value: !Ref StageFrontendBucket
          - Name: CF_DISTRIBUTION_ID
            Value: !Ref StageCFDistributionId
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend.yml
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/hotel-frontend-stage

  StageBackendBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hotel-backend-stage
      Description: Build and deploy backend Lambda to stage
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENV
            Value: stage
          - Name: LAMBDA_FUNCTION_NAME
            Value: !Ref StageLambdaFunctionName
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-backend.yml
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/hotel-backend-stage

  # ────────────────────────────────────────────────────────────────────────────
  # CodeBuild Projects — Prod (build-only, output artifacts for approval gate)
  # ────────────────────────────────────────────────────────────────────────────

  ProdFrontendBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hotel-frontend-prod-build
      Description: Build frontend for prod (outputs dist/ artifact, no deploy)
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENV
            Value: prod
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend-build.yml
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/hotel-frontend-prod-build

  ProdBackendBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hotel-backend-prod-build
      Description: Build backend Lambda zip for prod (no deploy)
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENV
            Value: prod
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-backend-build.yml
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/hotel-backend-prod-build

  # ────────────────────────────────────────────────────────────────────────────
  # CodeBuild Projects — Prod Deploy (run after manual approval)
  # ────────────────────────────────────────────────────────────────────────────

  ProdFrontendDeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hotel-frontend-prod-deploy
      Description: Deploy frontend artifact to prod S3 + invalidate CloudFront
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENV
            Value: prod
          - Name: FRONTEND_BUCKET
            Value: !Ref ProdFrontendBucket
          - Name: CF_DISTRIBUTION_ID
            Value: !Ref ProdCFDistributionId
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-frontend-deploy.yml
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/hotel-frontend-prod-deploy

  ProdBackendDeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: hotel-backend-prod-deploy
      Description: Deploy Lambda zip artifact to prod
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ENV
            Value: prod
          - Name: LAMBDA_FUNCTION_NAME
            Value: !Ref ProdLambdaFunctionName
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-backend-deploy.yml
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/hotel-backend-prod-deploy

  # ────────────────────────────────────────────────────────────────────────────
  # Stage Pipeline (development branch → auto-deploy to stage)
  # ────────────────────────────────────────────────────────────────────────────

  StagePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: hotel-stage-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub ${GitHubOwner}/${GitHubRepo}
                BranchName: development
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: BuildAndDeploy
          Actions:
            - Name: FrontendBuildDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref StageFrontendBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: StageFrontendArtifact
              RunOrder: 1
            - Name: BackendBuildDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref StageBackendBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: StageBackendArtifact
              RunOrder: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Prod Pipeline (master branch → build → manual approval → deploy to prod)
  # ────────────────────────────────────────────────────────────────────────────

  ProdPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: hotel-prod-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub ${GitHubOwner}/${GitHubRepo}
                BranchName: master
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: FrontendBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ProdFrontendBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: ProdFrontendArtifact
              RunOrder: 1
            - Name: BackendBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ProdBackendBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: ProdBackendArtifact
              RunOrder: 1

        - Name: Approve
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                NotificationArn: !Ref ApprovalTopic
                CustomData: 'Review build artifacts and approve to deploy to PRODUCTION'
                ExternalEntityLink: !Sub https://console.aws.amazon.com/codesuite/codepipeline/pipelines/hotel-prod-pipeline/view
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: FrontendDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ProdFrontendDeployProject
              InputArtifacts:
                - Name: ProdFrontendArtifact
              RunOrder: 1
            - Name: BackendDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ProdBackendDeployProject
              InputArtifacts:
                - Name: ProdBackendArtifact
              RunOrder: 1

Outputs:
  StagePipelineUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/hotel-stage-pipeline/view
    Description: AWS Console URL for the Stage pipeline

  ProdPipelineUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/hotel-prod-pipeline/view
    Description: AWS Console URL for the Prod pipeline

  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Description: S3 bucket storing pipeline artifacts
